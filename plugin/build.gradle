plugins {
    id 'com.android.application'
}

android {
    namespace 'com.plugin.sdk.plugin'
    compileSdk 37

    // 插件源码是纯 Java，禁用 AGP 9 的 built-in Kotlin：
    // 不关的话 AGP 会自动注入 kotlin-stdlib（约 2MB、上万个方法）进补丁 APK，
    // 既徒增补丁体积，又会因为 DexLoader 把补丁 dex 排在宿主前面而遮住宿主自己的 Kotlin 运行时。
    enableKotlin = false

    defaultConfig {
        applicationId "com.plugin.sdk.plugin"
        minSdk 21
        targetSdk 37
        versionCode 1
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 复用 AGP 的隐式 debug 签名配置。
            //
            // 必须引用 signingConfigs.debug，不能自己写一个名为 release 的 signingConfig
            // 再手写 ~/.android/debug.keystore 路径，原因有两个：
            //   1. AGP 只对「名为 debug 的 signingConfig」自动生成默认 keystore，
            //      自定义配置在干净机器 / CI 上会直接报 Keystore file not found；
            //   2. debug keystore 的实际位置受 ANDROID_USER_HOME / ANDROID_PREFS_ROOT /
            //      ANDROID_SDK_HOME 影响，手写 user.home 在设置了这些变量的机器上会
            //      解析到另一个目录，导致插件与宿主签名不一致 —— 构建成功但运行时验签必然失败。
            //
            // 验签要求「补丁签名 == 宿主签名」，宿主 demo 的 debug 包用的也是这份 debug 签名。
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}

// 编译完成后，把插件 APK 自动复制到 demo 的 assets（demo 打包时自动带上插件）
project.afterEvaluate {
    assembleRelease.doLast {
        copyPatchApkToDemo()
    }
}

def copyPatchApkToDemo() {
    // 用 layout.buildDirectory 而不是已废弃的 project.buildDir（Gradle 10 会移除）
    def apk = layout.buildDirectory.file("outputs/apk/release/plugin-release.apk").get().asFile
    if (!apk.isFile()) {
        // Gradle 的 copy{} 在源文件不存在时会静默跳过并不报错，
        // 结果是「构建成功但 demo 里带的是上一次的旧补丁」，很难排查，这里显式失败。
        throw new GradleException(
                "插件 APK 不存在，无法同步到 demo: ${apk}\n" +
                        "通常是 AGP 产物命名或路径变化导致（例如改了 applicationId、" +
                        "构建类型名、archivesBaseName，或去掉了 signingConfig），" +
                        "请检查 plugin 模块的构建配置。")
    }
    def destDir = new File(rootDir, "demo/src/main/assets")
    copy {
        from apk
        into destDir
        rename { "plugin_main.apk" }
    }
    logger.lifecycle("已同步插件 APK 到 demo/src/main/assets/plugin_main.apk（${apk.length()} 字节）")
}
